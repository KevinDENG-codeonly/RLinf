defaults:
  - model/pi0_5@actor.model
  - hybrid_engines/openpi_fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null

cluster:
  num_nodes: 1
  component_placement:
    actor: 0-1

runner:
  task_type: sft
  logger:
    log_path: ../results
    project_name: rlinf
    experiment_name: spiritai_pi05_full
    logger_backends: [wandb]
  max_epochs: -1
  max_steps: 90000
  val_check_interval: -1
  save_interval: 5000

data:
  train_data_paths: /path/to/spiritai_dataset
  num_workers: 4
  stateful_loader: true

actor:
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 1
  global_batch_size: 32
  seed: 42
  model:
    precision: fp32
    model_path: /path/to/pi05_base_rlinf_pytorch
    num_action_chunks: 50
    action_dim: 25
    openpi:
      config_name: pi05_spiritai_cartesian
      discrete_state_input: true
      max_token_len: 256
      embed_dtype: bf16
      torch_compile: false
    openpi_data:
      norm_stats_path: /path/to/spiritai_dataset/norm_stats.json
      zero_base_action_targets: false
  optim:
    lr: 1.0e-5
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-8
    weight_decay: 1.0e-10
    clip_grad: 1.0
    total_training_steps: 90000
    lr_warmup_steps: 1500
    lr_scheduler: openpi_cosine
    min_lr: 1.0e-5
  fsdp_config:
    sharding_strategy: full_shard
    use_orig_params: true
    gradient_checkpointing: true
    gradient_checkpointing_use_reentrant: false
    limit_all_gathers: true
    mixed_precision:
      param_dtype: bf16
      reduce_dtype: fp32
      buffer_dtype: fp32
