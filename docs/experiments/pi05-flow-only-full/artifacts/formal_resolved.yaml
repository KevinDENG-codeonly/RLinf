actor:
  model:
    model_type: openpi
    precision: fp32
    is_lora: false
    lora_rank: 32
    num_action_chunks: 50
    action_dim: 25
    use_proprio: true
    num_steps: 5
    add_value_head: false
    openpi:
      task: sft
      config_name: pi05_spiritai_cartesian
      num_images_in_input: 3
      action_chunk: 50
      action_env_dim: 25
      model_action_dim: 32
      paligemma_variant: gemma_2b
      action_expert_variant: gemma_300m
      max_token_len: 256
      discrete_state_input: true
      embed_dtype: bf16
      torch_compile: false
    model_path: /home/deng/Documents/codebase/RLinf/model_checkpoints/pi05_base_rlinf_pytorch
    openpi_data:
      norm_stats_path: /home/deng/Documents/codebase/RLinf/model_checkpoints/foldbox_assets/norm_stats.json
      zero_base_action_targets: true
  fsdp_config:
    strategy: fsdp
    sharding_strategy: full_shard
    gradient_checkpointing: true
    cpu_offload: false
    offload_pin_memory: false
    reshard_after_forward: true
    enable_gradient_accumulation: true
    forward_prefetch: false
    limit_all_gathers: true
    backward_prefetch: null
    use_orig_params: true
    use_liger_kernel: false
    mixed_precision:
      param_dtype: bf16
      reduce_dtype: fp32
      buffer_dtype: fp32
      cast_forward_inputs: false
      cast_root_forward_inputs: false
    wrappers:
      projections:
        module_names:
        - action_*proj
        - '*time_mlp_*'
      norms:
        module_classes:
        - RMSNorm
      vision_embedding:
        module_names:
        - img
        - img.stem
    mixed_precision_policies:
      fp32:
        param_dtype: fp32
        reduce_dtype: fp32
        buffer_dtype: fp32
      fp32_preserve_inputs:
        param_dtype: fp32
        reduce_dtype: fp32
        buffer_dtype: fp32
        cast_forward_inputs: false
    mixed_precision_rules:
      projections: fp32
      norms: fp32_preserve_inputs
      vision_embedding: fp32_preserve_inputs
    amp_autocast:
      enabled: false
      precision: bf16
    grad_scaler:
      enabled: false
    gradient_checkpointing_use_reentrant: false
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 8
  global_batch_size: 64
  seed: 42
  optim:
    lr: 1.0e-05
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 1.0e-10
    clip_grad: 1.0
    total_training_steps: 45000
    lr_warmup_steps: 750
    lr_scheduler: openpi_cosine
    min_lr: 1.0e-05
cluster:
  num_nodes: 1
  component_placement:
    actor: 0-1
runner:
  task_type: sft
  logger:
    log_path: /home/deng/Documents/codebase/RLinf/logs/20261027_152751-spiritai_foldbox_pi05_full_bs64
    project_name: rlinf
    experiment_name: spiritai_foldbox_pi05_full_bs64
    logger_backends:
    - wandb
  max_epochs: -1
  max_steps: 5000
  val_check_interval: -1
  save_interval: 2500
data:
  train_data_paths: /home/deng/Documents/dataset/20260805_FoldBox_SpiritAI_Moz1WB_14Annotations
  num_workers: 4
  stateful_loader: true
